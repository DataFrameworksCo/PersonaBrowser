appId: com.persona.browser
productName: Persona Browser
copyright: Copyright © 2026 Persona Browser
artifactName: PersonaBrowser-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icons

mac:
  target:
    - dmg
  icon: build/icons/icon.icns
  darkModeSupport: true
  artifactName: PersonaBrowser-${version}.${ext}

win:
  target:
    - nsis
  icon: build/icons/icon.ico
  artifactName: PersonaBrowser-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
