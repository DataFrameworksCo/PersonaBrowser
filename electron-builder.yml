appId: com.persona.browser
productName: Persona Browser
copyright: Copyright © 2026 Persona Browser
artifactName: PersonaBrowser-${version}-${arch}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - package.json

linux:
  target:
    - AppImage
    - deb
  category: Network

mac:
  target:
    - dmg
    - zip
  darkModeSupport: true

win:
  target:
    - nsis
  artifactName: PersonaBrowser-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
